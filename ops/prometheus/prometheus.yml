# Prometheus scrapes the API (HTTP and search latency) and the worker (pipeline counters).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker  # every replica: DNS returns one A record per worker container
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
