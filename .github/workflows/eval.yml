# LLM quality eval on the labeled set. Manual only: it makes real API calls with repository secrets,
# so it never runs on pull requests.
name: Eval

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        type: choice
        options: [gemini, claude]
        default: gemini
      prompt_version:
        description: "Prompt version (empty = default)"
        required: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run eval
        env:
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_PROMPT_VERSION: ${{ inputs.prompt_version }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
