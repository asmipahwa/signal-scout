[project]
name = "signal-scout"
version = "0.1.0"
description = "Signal Scout: AI Competitor Insights Pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3,<3",
    "datasketch>=1.6",
    "elasticsearch[async]>=8.19,<9",
    "feedparser>=6.0.14",
    "google-genai>=2.34,<3",
    "httpx>=0.28.1",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better unwrapped.
"src/signal_scout/enrichment/prompt.py" = ["E501"]
# Throwaway Sprint 1 prototype; not held to production style.
"prototype/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["datasketch", "datasketch.*"]  # ships no type hints
ignore_missing_imports = true
